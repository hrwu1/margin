<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08090a">
  <script>
    // Restore before styles paint, including when browser storage is blocked.
    try { document.documentElement.dataset.theme = localStorage.getItem('margin-workspace-theme-v1') === 'light' ? 'light' : 'dark'; }
    catch { document.documentElement.dataset.theme = 'dark'; }
    document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#ffffff' : '#08090a';
  </script>
  <title>Margin · Compare with a point of view</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;450;500;550;600&display=swap" rel="stylesheet">
  <script type="module" src="/src/main.tsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
